<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jedi Data Archives</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Jedi Data Archives</h1>
  <!-- novalidate, så serverens valideringsbesked vises i stedet for browserens -->
  <form id="character-form" novalidate>
    <label>Navn <input name="name" type="text"></label>
    <label>Rolle
      <select name="role">
        <option value="">Vælg rolle</option>
        <option>Jedi</option>
        <option>Sith</option>
        <option>Rebel</option>
        <option>Smuggler</option>
      </select>
    </label>
    <label>Planet <input name="planet" type="text"></label>
    <button type="submit">Opret</button>
  </form>
  <p id="form-error" role="alert" hidden></p>
  <table>
    <thead>
      <tr><th>Navn</th><th>Rolle</th><th>Planet</th></tr>
    </thead>
    <tbody id="characters"></tbody>
  </table>
  <script src="main.js"></script>
</body>
</html>
